pre-commit:
  parallel: true
  commands:
    fmt:
      run: cargo fmt --all -- --check
    clippy:
      run: just lint
    doc:
      run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items --exclude tdb-python
    typos:
      run: typos
      skip:
        - merge
        - rebase
    lazy-imports:
      # CI's lint job imports tdb_bench.ci_gate without building the
      # PyO3 wheel. Any module reachable at import time must not
      # require the native extension. The script simulates the
      # extension's absence and verifies the import chain. Catches
      # regressions like commit `0282db2` did, before push.
      # Use the .venv's python explicitly so the lint runs with numpy
      # and the project's other dev deps available. Falling back to
      # system `python3` (without the venv) makes every import path
      # fail on missing numpy and the lint silently skips — exactly
      # the failure mode that let the v0.3.3 CI break slip through.
      run: |
        if [ -x .venv/bin/python ]; then
          PYTHONPATH=python .venv/bin/python scripts/lint_lazy_imports.py
        else
          PYTHONPATH=python python3 scripts/lint_lazy_imports.py
        fi
      skip:
        - merge
        - rebase

pre-push:
  parallel: false
  commands:
    test:
      run: just test-ci
    deny:
      run: cargo deny check
