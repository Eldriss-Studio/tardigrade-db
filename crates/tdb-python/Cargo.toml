[package]
name = "tdb-python"
description = "Python bindings for TardigradeDB via PyO3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# tdb-python does not inherit workspace pedantic lints — PyO3 #[pymethods]
# require pass-by-value for Python-facing args (PyReadonlyArray1 etc.),
# which conflicts with clippy::needless_pass_by_value.
[lints.clippy]
doc_markdown = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lib]
name = "_native"
# `rlib` alongside `cdylib` lets the in-crate `stub_gen` binary import
# the library to walk its `#[pyclass]`/`#[pyfunction]` items. The
# `cdylib` is what maturin packages into the wheel; `rlib` exists only
# so the stub-gen tooling can run.
crate-type = ["cdylib", "rlib"]

[dependencies]
tdb-core = { workspace = true }
tdb-engine = { workspace = true }
tdb-retrieval = { workspace = true }
# Need direct access to `TextStore` (the engine hands out an
# `Arc<TextStore>` handle that the Python wrapper caches outside the
# engine mutex for lock-free `pack_text` lookups).
tdb-storage = { workspace = true }
half = { workspace = true }
pyo3 = "0.29"
numpy = "0.28"
# Stub generator. The `numpy` feature teaches it to map
# `PyReadonlyArray1<f32>` and friends to `numpy.typing.NDArray[...]`
# in generated .pyi instead of falling silently to `typing.Any`.
pyo3-stub-gen = { version = "0.22", features = ["numpy"] }

# Binary target that walks the PyO3 surface and emits .pyi files.
# Invoked from the maturin build pipeline (see ../../pyproject.toml).
[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = []
