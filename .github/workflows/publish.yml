name: Publish to PyPI

on:
  release:
    types: [published]

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Fail-fast guard: catch the GitHub-Release-vs-tag-commit drift
      # that caused the silent v0.6.0 / v0.7.0 PyPI publish failures.
      # If the release was created against a stale commit, Cargo.toml
      # here won't match the tag — bail before paying for a full build.
      - name: Verify Cargo.toml version matches tag
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Cargo.toml workspace version '$ACTUAL' does not match release tag '$EXPECTED'"
            echo "::error::The GitHub Release's target commit is likely a stale main, not the version-bumped commit."
            echo "::error::Recreate the release with: gh release create '$TAG' --target <correct-commit-sha>"
            exit 1
          fi
          echo "Cargo.toml version $ACTUAL matches tag $EXPECTED"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          # Pin to interpreters we explicitly validate. `--find-interpreter`
          # discovers every Python on the runner — that's how v0.7.4 ended
          # up shipping cp314, cp315, pp311 wheels we never tested. PyO3
          # 0.28 officially supports up to CPython 3.13; the cp313t free-
          # threaded wheel ships from a separate job below.
          args: --release --out dist --interpreter python3.10 python3.11 python3.12 python3.13
          manylinux: auto

      # Belt-and-braces: even if Cargo.toml was right, confirm the
      # built artifact carries the right version on disk. A wheel
      # whose filename version differs from the tag is what PyPI
      # rejects with the 400 File-already-exists shape.
      #
      # Wheel filename grammar (PEP 491): {name}-{version}-{python}-
      # {abi}-{platform}.whl. PyPI normalizes hyphens in the project
      # name to underscores in the wheel, so the version is always
      # field 2 when splitting on '-'. cut beats a regex here because
      # it can't be tricked by a hyphen-containing python tag.
      - name: Verify wheel filenames match tag
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          fail=0
          for whl in dist/*.whl; do
            VER=$(basename "$whl" | cut -d- -f2)
            if [ "$VER" != "$EXPECTED" ]; then
              echo "::error::Wheel $(basename "$whl") version '$VER' does not match tag '$EXPECTED'"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  build-wheels-freethreaded:
    name: Build free-threaded wheel (cp313t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Same version-vs-tag guard as the abi3 builds. A stale-target
      # GitHub Release would otherwise burn a full free-threaded build
      # before erroring on the wheel-filename check downstream.
      - name: Verify Cargo.toml version matches tag
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Cargo.toml workspace version '$ACTUAL' does not match release tag '$EXPECTED'"
            exit 1
          fi

      # python3.13t — free-threaded CPython per PEP 703. setup-python
      # serves these binaries since mid-2025; if they ever vanish from
      # the Action's manifest, swap to actions/setup-python@v7 with
      # `allow-prereleases: true` or fall back to a uv-managed install.
      - name: Install free-threaded Python 3.13t
        uses: actions/setup-python@v7
        with:
          python-version: '3.13t'

      - name: Install maturin
        run: pip install maturin

      # Disable abi3 forward-compat: cp313t does not share an ABI with
      # the abi3 wheels. Build under the explicit interpreter so the
      # wheel filename carries the cp313-cp313t ABI tags PyPI requires
      # to route 3.13t installs to this wheel.
      - name: Build cp313t wheel
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 0
        run: |
          maturin build --release --out dist --interpreter $(which python3.13t)

      - name: Verify wheel filename carries cp313t tags
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          fail=0
          for whl in dist/*.whl; do
            VER=$(basename "$whl" | cut -d- -f2)
            if [ "$VER" != "$EXPECTED" ]; then
              echo "::error::Wheel $(basename "$whl") version '$VER' does not match tag '$EXPECTED'"
              fail=1
            fi
            case "$(basename "$whl")" in
              *-cp313-cp313t-*) ;;
              *)
                echo "::error::Wheel $(basename "$whl") is missing cp313-cp313t ABI tags"
                fail=1
                ;;
            esac
          done
          [ "$fail" = "0" ] || exit 1

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-freethreaded
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Cargo.toml version matches tag
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Cargo.toml workspace version '$ACTUAL' does not match release tag '$EXPECTED'"
            exit 1
          fi

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Verify sdist filename matches tag
        shell: bash
        env:
          GH_REF: ${{ github.ref }}
        run: |
          TAG="${GH_REF#refs/tags/}"
          EXPECTED="${TAG#v}"
          for tgz in dist/*.tar.gz; do
            # sdist grammar: {name}-{version}.tar.gz. Strip the suffix,
            # then field 2 on '-' is the version. Same logic as the
            # wheel check above; same reason for cut over a regex.
            VER=$(basename "$tgz" .tar.gz | cut -d- -f2)
            if [ "$VER" != "$EXPECTED" ]; then
              echo "::error::sdist $(basename "$tgz") version '$VER' does not match tag '$EXPECTED'"
              exit 1
            fi
          done

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-wheels-freethreaded, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
