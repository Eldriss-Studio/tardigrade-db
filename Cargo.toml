[workspace]
resolver = "2"
members = [
    "crates/tdb-core",
    "crates/tdb-storage",
    "crates/tdb-retrieval",
    "crates/tdb-index",
    "crates/tdb-governance",
    "crates/tdb-engine",
    "crates/tdb-python",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# Internal crates
tdb-core = { path = "crates/tdb-core" }
tdb-storage = { path = "crates/tdb-storage" }
tdb-retrieval = { path = "crates/tdb-retrieval" }
tdb-index = { path = "crates/tdb-index" }
tdb-governance = { path = "crates/tdb-governance" }
tdb-engine = { path = "crates/tdb-engine" }

# Shared external dependencies
thiserror = "2"
# Diagnostic-quality error reporting (codes, help text, source spans).
# `default-features = false` keeps the dep light (no fancy terminal
# renderer), but we still need the `derive` feature for the
# `#[derive(Diagnostic)]` macro.
miette = { version = "7", default-features = false, features = ["derive"] }
memmap2 = "0.9"
# Generic-purpose entropy coder used by `ZstdQ4Codec` to compress
# already-Q4-quantized cell bytes before they hit disk. Level 3 is the
# encode/ratio sweet spot for byte-oriented payloads (level 19 buys ~5%
# more compression for 10× the encode time — not worth it on a write path).
zstd = { version = "0.13", default-features = false }
# Atomic snapshot reads against a value that writers replace wholesale.
# Backs the substores (TextStore, BlockPool index, Vamana graph) that
# concurrent retrieval paths read without blocking writers.
arc-swap = "1"
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"
half = { version = "2", features = ["num-traits"] }
bytemuck = { version = "1", features = ["derive"] }
lru = "0.18"

# Snapshot / persistence packaging (M1.2). `tar` for portable
# archive packaging, `serde`/`serde_json` for the manifest header,
# `sha2` for content-integrity hashes. All mature low-churn crates
# used in production storage engines.
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

# Shared dev dependencies (used via [dev-dependencies] foo = { workspace = true })
criterion = { version = "0.8", features = ["html_reports"] }
rstest = "0.26"
tempfile = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# ─────────────────────────────────────────────────────────────────────
# Policy: `cast_precision_loss` is allowed workspace-wide.
#
# This lint fires on every `usize → f32`, `u64 → f32`, `i32 → f32` etc.,
# i.e. integer-to-float casts where the integer type has more bits than
# the float mantissa. In a KV-cache retrieval engine this surfaces in
# ~200 sites: count → ratio, index → coordinate, mean denominator,
# decay-exponent argument, score normalization, etc.
#
# We follow the convention of every major numerical-Rust project
# (tokio, DataFusion, TiKV, Polars, Qdrant, LanceDB, candle): allow
# this lint at the workspace level because it flags a *property of the
# type system*, not a bug shape. Real precision bugs live in algorithm
# choice, accumulator type, and summation order — none of which clippy
# can see by looking at a single cast.
#
# Numerical correctness is defended by acceptance tests that pin
# observable behavior:
#   - `tdb-engine`'s recall @ 5K cells (100% on Q4 + Top5Avg pipeline)
#   - `tdb-storage::quantization` Q4 SNR > 20 dB round-trip
#   - `tdb-retrieval::per_token::compute_whitening_matrix` uses an f64
#     inner-product accumulator before narrowing to f32 (line ~993)
#   - `tdb-governance::scoring` bounds ι ∈ [0, 100] (fits f32 mantissa
#     exactly) and uses `powi` exponentiation-by-squaring for decay,
#     so accumulated error is bounded across the engine's lifetime
#
# If a numerical regression slips through, the fix is to change the
# accumulator type or the algorithm — not to add 200 `#[allow]`
# annotations that drown the real concerns in syntactic noise.
# ─────────────────────────────────────────────────────────────────────
cast_precision_loss = "allow"

# Lints whose allowlist entries were retired in Phase 1 / Phase 2 of
# the warnings-cleanup initiative — every site now either uses a checked
# conversion or has a local `#[allow] // Reason:` annotation citing the
# specific invariant. Re-enabling these at workspace level keeps new
# offenders out.
#
#   cast_possible_truncation, cast_sign_loss, cast_lossless,
#   must_use_candidate, return_self_not_must_use, struct_field_names,
#   missing_errors_doc, missing_panics_doc, module_name_repetitions

# Hard denials — project invariants
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
uninlined_format_args = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
doc_markdown = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_must_use = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 2
strip = "none"

# Faster CI builds — no debug info, no incremental (DataFusion/Qdrant pattern)
[profile.ci]
inherits = "dev"
debug = 0
incremental = false
