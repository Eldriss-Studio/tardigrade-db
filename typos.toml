[default.extend-words]
# LoRA formula: W' = W + αBA (B×A is a matrix product, not a typo)
BA = "BA"
# Qwen3 /no_think feature uses "nothink" as variable name prefix
nothink = "nothink"
# Sergey Brin (PageRank co-author)
Brin = "Brin"
# LaSER paper (Latent Space Explicit Reasoning)
SER = "SER"
# Akari Asai (Self-RAG author)
Asai = "Asai"
# Ned — dog's name in LoCoMo eval dataset Q&A pairs
Ned = "Ned"
# `numpy.typing.NDArray` — typos splits the dotted path and reads
# "ND" as a typo of "AND". The class is the real numpy type name.
ND = "ND"
# Dota 2 — referenced as the canonical changelog-writing style guide
# in RELEASE.md. typos flags it as a typo of "Data".
Dota = "Dota"

[default.extend-identifiers]
# flate2 — the de-facto Rust compression crate. typos splits the
# identifier on digits and reads "flate" as a typo of "flat".
flate2 = "flate2"

[files]
extend-exclude = ["Cargo.lock", "*.bin", "*.ptx", "*.cubin", "_session_backup/"]
